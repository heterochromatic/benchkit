[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchkit"
version = "0.1.0"
description = "Shared harness for public GTM benchmarks: run lifecycle, usage attribution, shared verifier, scoring plugins, anonymized results, agent runner"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
bench = "benchkit.cli:main"

[tool.setuptools]
packages = ["benchkit"]
